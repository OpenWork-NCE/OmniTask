services:
  - type: web
    name: omnitask-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/readiness
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: JWT_PRIVATE_KEY
        value: file:/etc/secrets/jwt-private.pem
      - key: JWT_PUBLIC_KEY
        value: file:/etc/secrets/jwt-public.pem
      - key: JWT_ISSUER
        value: omnitask
      - key: JWT_AUDIENCE
        value: omnitask-api
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
