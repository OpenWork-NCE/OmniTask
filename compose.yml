name: omnitask

services:
  mysql:
    image: mysql:8.4.11@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: omnitask
      MYSQL_USER: omnitask
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run ./scripts/init-local-env.sh first}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/omnitask?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USERNAME: omnitask
      DB_PASSWORD: ${DB_PASSWORD:?Run ./scripts/init-local-env.sh first}
      JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./.secrets/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./.secrets/jwt-public.pem:/run/secrets/jwt-public.pem:ro

volumes:
  mysql-data:
