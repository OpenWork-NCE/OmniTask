name: omnitask_mobile
description: OmniTask mobile client for the shared task management API.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.4 <4.0.0"

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.1.0
  flutter_svg: 2.3.0
  intl: 0.20.3
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: 2.4.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/graphics/
  fonts:
    - family: Funnel Display
      fonts:
        - asset: assets/fonts/FunnelDisplay-Variable.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Variable.ttf
