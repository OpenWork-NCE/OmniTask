name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21.0.12+8"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Build production image
        run: docker build --tag "omnitask-api:${GITHUB_SHA}" backend

      - name: Smoke test the packaged API
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ./scripts/init-local-env.sh
          compose=(docker compose -p omnitask-ci -f compose.yml -f compose.ci.yml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --no-build --wait --wait-timeout 120
          python3 scripts/smoke-api.py http://localhost:18080

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-verification
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/spotbugsXml.xml
            backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: warn
