services:
  mysql:
    ports: !reset []
  api:
    image: omnitask-api:${API_IMAGE_TAG:?Set API_IMAGE_TAG to the image being tested}
    ports: !override
      - "127.0.0.1:18080:8080"
  web:
    image: omnitask-web:${WEB_IMAGE_TAG:?Set WEB_IMAGE_TAG to the image being tested}
    ports: !override
      - "127.0.0.1:18081:8080"
